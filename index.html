<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma liste de tâches</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Ma liste de tâches</h1>

      <p class="compteur" aria-live="polite">Chargement...</p>

      <form id="form-ajout" class="form-ajout" novalidate>
        <label for="nouvelle-tache">Nouvelle tâche</label>

        <div class="ligne-ajout">
          <input
            type="text"
            id="nouvelle-tache"
            name="tache"
            autocomplete="off"
            required
            minlength="3"
            aria-describedby="erreur-tache"
          />
          <button type="submit" class="btn-ajouter">Ajouter</button>
        </div>

        <p id="erreur-tache" class="message-erreur" role="alert"></p>
      </form>

      <div class="outils">
        <div class="filtres" role="group" aria-label="Afficher les tâches">
          <button
            class="btn-filtre actif"
            data-filtre="toutes"
            aria-pressed="true"
          >
            Toutes
          </button>
          <button
            class="btn-filtre"
            data-filtre="en-cours"
            aria-pressed="false"
          >
            En cours
          </button>
          <button
            class="btn-filtre"
            data-filtre="terminees"
            aria-pressed="false"
          >
            Terminées
          </button>
        </div>

        <div class="recherche-tri">
          <div class="champ-outil">
            <label for="recherche">Rechercher</label>
            <input type="search" id="recherche" autocomplete="off" />
          </div>

          <div class="champ-outil">
            <label for="tri">Trier par</label>
            <select id="tri">
              <option value="date">Ordre d'ajout</option>
              <option value="nom">Nom (A → Z)</option>
            </select>
          </div>
        </div>
      </div>

      <ul class="liste-taches"></ul>

      <div class="stats">
        <p id="stats-texte"></p>
        <div class="barre-progression" aria-hidden="true">
          <div class="barre-remplissage"></div>
        </div>
      </div>
    </main>
  </body>
</html>
