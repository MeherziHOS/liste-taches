<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma liste de tâches</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Ma liste de tâches</h1>

      <p class="compteur" aria-live="polite">Chargement...</p>

      <form id="form-ajout" class="form-ajout" novalidate>
        <label for="nouvelle-tache">Nouvelle tâche</label>

        <div class="ligne-ajout">
          <input
            type="text"
            id="nouvelle-tache"
            name="tache"
            autocomplete="off"
            required
            minlength="3"
            aria-describedby="erreur-tache"
          />
          <button type="submit" class="btn-ajouter">Ajouter</button>
        </div>

        <p id="erreur-tache" class="message-erreur" role="alert"></p>
      </form>

      <ul class="liste-taches"></ul>
    </main>
  </body>
</html>
