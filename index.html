<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma liste de tâches</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Ma liste de tâches</h1>

      <p class="compteur" aria-live="polite">Chargement...</p>

      <div class="zone-ajout">
        <button
          id="btn-nouvelle-tache"
          aria-expanded="false"
          aria-controls="formulaire-ajout"
        >
          + Nouvelle tâche
        </button>

        <div id="formulaire-ajout" class="formulaire-ajout" hidden>
          <label for="champ-nouvelle-tache">Nouvelle tâche</label>
          <input type="text" id="champ-nouvelle-tache" autocomplete="off" />
          <button id="btn-ajouter">Ajouter</button>
        </div>
      </div>

      <ul class="liste-taches"></ul>
    </main>
  </body>
</html>
